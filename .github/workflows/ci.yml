name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: make fmt-check

      - name: Run lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.4
          args: --timeout=5m --config=.golangci.yml

      - name: Build
        run: make build

      - name: GoReleaser snapshot
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser-pro
          version: v2.17.0
          args: release --snapshot --clean --skip=publish,homebrew,scoop,aur,winget,chocolatey,npm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUTRACK_E2E_RESET: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Start E2E environment
        run: ./scripts/e2e/up.sh

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run Tests
        run: |
          set -a && source .e2e/youtrack.env && set +a
          gotestsum --junitfile test-results.xml --format github-actions -- -count=1 ./test/...

      - name: E2E Summary
        if: always()
        run: |
          pip install --quiet defusedxml
          python3 - <<'EOF'
          import defusedxml.ElementTree as ET, os, sys
          try:
              root = ET.parse('test-results.xml').getroot()
          except Exception:
              sys.exit(0)
          suites = root.findall('testsuite') or [root]
          total  = sum(int(s.get('tests',     0)) for s in suites)
          n_fail = sum(int(s.get('failures',  0)) + int(s.get('errors', 0)) for s in suites)
          n_skip = sum(int(s.get('skipped',   0)) for s in suites)
          n_pass = total - n_fail - n_skip
          t_sec  = sum(float(s.get('time',    0)) for s in suites)
          failed = []
          for tc in root.iter('testcase'):
              node = tc.find('failure') or tc.find('error')
              if node is not None:
                  detail = (node.get('message') or node.text or '').strip()
                  failed.append((tc.get('name', '?'), detail))
          out = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/stdout')
          with open(out, 'a') as f:
              f.write('## E2E Test Results\n\n')
              f.write('| ✅ Passed | ❌ Failed | ⏭ Skipped | ⏱ Time |\n')
              f.write('|:---:|:---:|:---:|:---:|\n')
              f.write(f'| {n_pass} | {n_fail} | {n_skip} | {t_sec:.0f}s |\n\n')
              for name, detail in failed:
                  f.write(f'### ❌ `{name}`\n\n```\n{detail}\n```\n\n')
          for name, detail in failed:
              msg = detail.split('\n')[0] if detail else 'test failed'
              print(f'::error title={name}::{msg}')
          EOF

      - name: Collect E2E logs
        if: always()
        run: |
          make e2e-logs
          tar -czf e2e-logs.tar.gz -C .e2e/logs . 2>/dev/null || true

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-logs
          path: e2e-logs.tar.gz
          if-no-files-found: ignore

      - name: Tear down Docker E2E
        if: always()
        run: make e2e-down
