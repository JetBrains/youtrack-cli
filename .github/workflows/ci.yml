name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true

      - name: Check formatting
        run: make fmt-check

      - name: Run lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m --config=.golangci.yml
          # lint runs in seconds here; skipping the cache rules out stale-cache
          # flakiness for free
          skip-cache: true

      - name: Run pure-function unit tests
        run: go test ./api/ ./internal/... -count=1

      - name: Run concurrency tests
        run: make concurrency

      - name: Scan for known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Build
        run: make build

      - name: GoReleaser snapshot
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser-pro
          version: v2.17.0
          args: release --snapshot --clean --skip=publish,homebrew,scoop,aur,winget,chocolatey,npm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Verify snapshot binary --version
        if: runner.os == 'Linux' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          arch=$(uname -m)
          case "$arch" in
            x86_64) goarch=amd64 ;;
            aarch64|arm64) goarch=arm64 ;;
            *) echo "unsupported runner arch: $arch" >&2; exit 1 ;;
          esac
          binary=$(find dist -maxdepth 1 -type d -name "youtrack_linux_${goarch}*" -print -quit)/youtrack
          expected=$(jq -r .version dist/metadata.json)
          actual=$("$binary" --version)
          echo "expected version: $expected"
          echo "actual output:    $actual"
          case "$actual" in
            *"$expected"*) ;;
            *) echo "binary --version output does not contain snapshot version $expected" >&2; exit 1 ;;
          esac

  e2e:
    needs: verify
    uses: ./.github/workflows/e2e.yml

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # Fails on any Writerside problem (broken link or anchor, bad markup, undefined variable).
      - name: Build Writerside docs
        run: make docs-build
