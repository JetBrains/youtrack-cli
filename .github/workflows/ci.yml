name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: make fmt-check

      - name: Run lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m --config=.golangci.yml
          # lint runs in seconds here; skipping the cache rules out stale-cache
          # flakiness for free
          skip-cache: true

      - name: Run pure-function unit tests
        run: go test ./api/ ./internal/... -count=1

      - name: Scan for known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
        env:
          GOTOOLCHAIN: go1.26.9

      - name: Build
        run: make build

      - name: GoReleaser snapshot
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: v2.17.0
          args: release --snapshot --clean --skip=publish,homebrew,scoop,aur,winget,chocolatey,npm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Verify snapshot binary --version
        if: runner.os == 'Linux' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          arch=$(uname -m)
          case "$arch" in
            x86_64) goarch=amd64 ;;
            aarch64|arm64) goarch=arm64 ;;
            *) echo "unsupported runner arch: $arch" >&2; exit 1 ;;
          esac
          binary=$(find dist -maxdepth 1 -type d -name "youtrack_linux_${goarch}*" -print -quit)/youtrack
          expected=$(jq -r .version dist/metadata.json)
          actual=$("$binary" --version)
          echo "expected version: $expected"
          echo "actual output:    $actual"
          case "$actual" in
            *"$expected"*) ;;
            *) echo "binary --version output does not contain snapshot version $expected" >&2; exit 1 ;;
          esac

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUTRACK_E2E_RESET: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Start E2E environment
        run: ./scripts/e2e/up.sh

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run Tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -a && source .e2e/youtrack.env && set +a
          gotestsum --junitfile test-results.xml --format github-actions -- -count=1 ./test/...

      - name: E2E Summary
        if: always()
        run: |
          pip install --quiet defusedxml
          python3 - <<'EOF'
          import defusedxml.ElementTree as ET, os, sys
          try:
              root = ET.parse('test-results.xml').getroot()
          except Exception:
              sys.exit(0)
          suites = root.findall('testsuite') or [root]
          total  = sum(int(s.get('tests',     0)) for s in suites)
          n_fail = sum(int(s.get('failures',  0)) + int(s.get('errors', 0)) for s in suites)
          n_skip = sum(int(s.get('skipped',   0)) for s in suites)
          n_pass = total - n_fail - n_skip
          t_sec  = sum(float(s.get('time',    0)) for s in suites)
          failed = []
          for tc in root.iter('testcase'):
              node = tc.find('failure') or tc.find('error')
              if node is not None:
                  detail = (node.get('message') or node.text or '').strip()
                  failed.append((tc.get('name', '?'), detail))
          out = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/stdout')
          with open(out, 'a') as f:
              f.write('## E2E Test Results\n\n')
              f.write('| ✅ Passed | ❌ Failed | ⏭ Skipped | ⏱ Time |\n')
              f.write('|:---:|:---:|:---:|:---:|\n')
              f.write(f'| {n_pass} | {n_fail} | {n_skip} | {t_sec:.0f}s |\n\n')
              for name, detail in failed:
                  f.write(f'### ❌ `{name}`\n\n```\n{detail}\n```\n\n')
          for name, detail in failed:
              msg = detail.split('\n')[0] if detail else 'test failed'
              print(f'::error title={name}::{msg}')
          EOF

      - name: Collect E2E logs
        if: always()
        run: |
          make e2e-logs
          tar -czf e2e-logs.tar.gz -C .e2e/logs . 2>/dev/null || true

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: e2e-logs.tar.gz
          if-no-files-found: ignore

      - name: Tear down Docker E2E
        if: always()
        run: make e2e-down
