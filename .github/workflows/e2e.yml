name: E2E
run-name: E2E on YouTrack ${{ inputs.youtrack || 'harness default' }}

# CI calls this with the harness default image (scripts/e2e/lib.sh); run it by hand to test another YouTrack image.
on:
  workflow_call:
    inputs:
      youtrack:
        description: jetbrains/youtrack image tag; empty uses the harness default
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      youtrack:
        description: jetbrains/youtrack image tag; empty uses the harness default
        type: string
        default: '2026.2.19884' # latest 2026.2 release

permissions:
  contents: read

jobs:
  e2e:
    # CI reports this as "e2e / youtrack-2026.3", the check the master ruleset requires.
    # ponytail: the major is hard-coded; bump it with YOUTRACK_E2E_VERSION in scripts/e2e/lib.sh and in the ruleset.
    name: youtrack-${{ inputs.youtrack || '2026.3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUTRACK_E2E_RESET: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true

      - name: Select YouTrack image
        if: inputs.youtrack != ''
        env:
          YOUTRACK: ${{ inputs.youtrack }}
        run: |
          if [[ ! "$YOUTRACK" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::youtrack must be an image tag such as 2026.2.19884, got '$YOUTRACK'"
            exit 1
          fi
          echo "YOUTRACK_E2E_VERSION=$YOUTRACK" >> "$GITHUB_ENV"
          echo "### YouTrack image: \`jetbrains/youtrack:$YOUTRACK\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Start E2E environment
        run: ./scripts/e2e/up.sh

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run Tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -a && source .e2e/youtrack.env && set +a
          gotestsum --junitfile test-results.xml --format github-actions -- -count=1 ./test/...

      - name: E2E Summary
        if: always()
        run: |
          pip install --quiet defusedxml
          python3 - <<'EOF'
          import defusedxml.ElementTree as ET, os, sys
          try:
              root = ET.parse('test-results.xml').getroot()
          except Exception:
              sys.exit(0)
          suites = root.findall('testsuite') or [root]
          total  = sum(int(s.get('tests',     0)) for s in suites)
          n_fail = sum(int(s.get('failures',  0)) + int(s.get('errors', 0)) for s in suites)
          n_skip = sum(int(s.get('skipped',   0)) for s in suites)
          n_pass = total - n_fail - n_skip
          t_sec  = sum(float(s.get('time',    0)) for s in suites)
          failed = []
          for tc in root.iter('testcase'):
              node = tc.find('failure') or tc.find('error')
              if node is not None:
                  detail = (node.get('message') or node.text or '').strip()
                  failed.append((tc.get('name', '?'), detail))
          out = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/stdout')
          with open(out, 'a') as f:
              f.write('## E2E Test Results\n\n')
              f.write('| ✅ Passed | ❌ Failed | ⏭ Skipped | ⏱ Time |\n')
              f.write('|:---:|:---:|:---:|:---:|\n')
              f.write(f'| {n_pass} | {n_fail} | {n_skip} | {t_sec:.0f}s |\n\n')
              for name, detail in failed:
                  f.write(f'### ❌ `{name}`\n\n```\n{detail}\n```\n\n')
          for name, detail in failed:
              msg = detail.split('\n')[0] if detail else 'test failed'
              print(f'::error title={name}::{msg}')
          EOF

      - name: Collect E2E logs
        if: always()
        run: |
          make e2e-logs
          tar -czf e2e-logs.tar.gz -C .e2e/logs . 2>/dev/null || true

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: e2e-logs.tar.gz
          if-no-files-found: ignore

      - name: Tear down Docker E2E
        if: always()
        run: make e2e-down

