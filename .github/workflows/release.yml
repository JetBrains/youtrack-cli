name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # JetBrains GPG code-signing key selected on the CodeSign service (public fingerprint).
  FINGERPRINT: B46DC71E03FEEB7F89D1F2491F7A8F87B9D8F501
  CODESIGN_SHA256_AMD64: b25957d0a5038419d916b5f07cd12d78a05666931a0e2e9c977e0d76284bf39c
  CODESIGN_SHA256_ARM64: d34ac6dc446a7490939b1b4d90bd67af04004627053e0f5298985755c9d71e6e

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUTRACK_E2E_RESET: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Require tag commit on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting and lint
        run: make fmt-check && make lint

      - name: Run pure-function tests
        run: go test ./api/ ./internal/... -count=1

      - name: Scan for known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Build
        run: make build

      - name: Run full E2E suite
        run: make test

  goreleaser:
    needs: verify
    # Self-hosted runner with network access to the JetBrains CodeSign service.
    # codesign-client signs the cross-compiled macOS and Windows binaries remotely,
    # so the whole release is built and signed in this one Linux job.
    runs-on: sre-eqx-kata
    environment: release
    permissions:
      contents: write
      # Build provenance attestations: OIDC identity for Sigstore signing, plus write access to the attestation store.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install CodeSign client
        run: |
          set -eu
          case "$(uname -m)" in
            x86_64) A=amd64; HASH="$CODESIGN_SHA256_AMD64" ;;
            aarch64|arm64) A=arm64; HASH="$CODESIGN_SHA256_ARM64" ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://codesign-distribution.labs.jb.gg/codesign-client-linux-$A" -o "$HOME/.local/bin/codesign-client"
          echo "$HASH  $HOME/.local/bin/codesign-client" | sha256sum --check --strict
          chmod +x "$HOME/.local/bin/codesign-client"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: v2.17.0
          # External package-manager publishing is credential-gated; enable a
          # channel by removing it here and adding its secret.
          args: release --clean --skip=homebrew,scoop,aur,winget,chocolatey,npm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          SERVICE_ACCOUNT_NAME: ${{ secrets.SERVICE_ACCOUNT_NAME }}
          SERVICE_ACCOUNT_TOKEN: ${{ secrets.SERVICE_ACCOUNT_TOKEN }}
          SIGN: "true"

      # Provenance independent of the release assets: verify with `gh attestation verify <file> --repo JetBrains/youtrack-cli`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
