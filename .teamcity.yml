version: 1
parameters:
  env.SIGN: 'true'
  env.FINGERPRINT: B46DC71E03FEEB7F89D1F2491F7A8F87B9D8F501
  env.CODESIGN_SHA256_AMD64: ce5c7b8432e2009af2eb3b7c26cdaeac2204f66960c67708f9d848bf8b88b2b8
  env.CODESIGN_SHA256_ARM64: c94eb9ca7a18cfec232ba76f6c5c781853b896180e8d54f69fc948e9bc073835
  env.CHOCO_VERSION: 2.4.3
  env.CHOCO_SHA256: 5b1e52185afc6573ea88376fff3fe093b2e33ef16397f5e81626126c208df335
  env.WINGET_FORK_OWNER: tiulpin
jobs:
  goreleaser:
    name: GoReleaser
    allow-reuse: false
    runs-on:
      self-hosted:
        - requirement: equals
          name: Linux Docker engine
          parameter: container.engine.osType
          value: linux
    files-publication:
      - path: dist/**
        publish-artifact: true
        share-with-jobs: false
    steps:
      - type: script
        name: Sign and publish GitHub, Homebrew, Scoop, Chocolatey, and WinGet
        docker-image: goreleaser/goreleaser-pro:latest
        docker-run-parameters: --user 0
        script-content: |-
          set -eu
          : "${GITHUB_TOKEN:?Add the env.GITHUB_TOKEN pipeline secret}"
          : "${GORELEASER_KEY:?Add the env.GORELEASER_KEY pipeline secret}"
          : "${SERVICE_ACCOUNT_NAME:?Add the env.SERVICE_ACCOUNT_NAME pipeline secret}"
          : "${SERVICE_ACCOUNT_TOKEN:?Add the env.SERVICE_ACCOUNT_TOKEN pipeline secret}"
          : "${CHOCOLATEY_API_KEY:?Add the env.CHOCOLATEY_API_KEY pipeline secret}"
          : "${WINGET_GITHUB_TOKEN:?Add the env.WINGET_GITHUB_TOKEN pipeline secret}"
          apk add --no-cache curl coreutils mono
          git config --global --add safe.directory "$(pwd)"
          case "$(uname -m)" in
            x86_64) arch=amd64; hash="$CODESIGN_SHA256_AMD64" ;;
            aarch64|arm64) arch=arm64; hash="$CODESIGN_SHA256_ARM64" ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://codesign-distribution.labs.jb.gg/codesign-client-linux-$arch" -o "$HOME/.local/bin/codesign-client"
          echo "$hash  $HOME/.local/bin/codesign-client" | sha256sum --check --strict
          chmod +x "$HOME/.local/bin/codesign-client"
          curl -fsSL "https://github.com/chocolatey/choco/releases/download/$CHOCO_VERSION/chocolatey.v$CHOCO_VERSION.tar.gz" -o /tmp/choco.tar.gz
          echo "$CHOCO_SHA256  /tmp/choco.tar.gz" | sha256sum --check --strict
          mkdir -p "$HOME/.local/opt/chocolatey/lib"
          tar -xzf /tmp/choco.tar.gz -C "$HOME/.local/opt/chocolatey"
          cert-sync /etc/ssl/certs/ca-certificates.crt >/dev/null 2>&1 || true
          printf '#!/bin/sh\nexec mono %s/choco.exe "$@"\n' "$HOME/.local/opt/chocolatey" > "$HOME/.local/bin/choco"
          chmod +x "$HOME/.local/bin/choco"
          export ChocolateyInstall="$HOME/.local/opt/chocolatey"
          export PATH="$HOME/.local/bin:$PATH"
          export HOMEBREW_TAP_GITHUB_TOKEN="$GITHUB_TOKEN"
          export SCOOP_GITHUB_TOKEN="$GITHUB_TOKEN"
          goreleaser release --clean --skip=aur,npm
secrets:
  env.GORELEASER_KEY: credentialsJSON:3d85f71e-e2f5-4878-8741-cd5867b7e170
  env.GITHUB_TOKEN: credentialsJSON:75dd8a3d-e893-4104-b457-548bccfbcde1
  env.SERVICE_ACCOUNT_TOKEN: credentialsJSON:03fc9f4b-ea7b-4959-9232-ec919554e867
  env.SERVICE_ACCOUNT_NAME: credentialsJSON:554c2bc6-101e-40a2-8264-aa55f9977270
  env.CHOCOLATEY_API_KEY: credentialsJSON:4a10a3c5-1ff6-4cb0-a2eb-e1bf9d10fff4
  env.WINGET_GITHUB_TOKEN: credentialsJSON:3da89a31-a140-40c7-ba73-b4c3843542fd
